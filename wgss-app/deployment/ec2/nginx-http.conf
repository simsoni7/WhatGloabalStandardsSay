user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 access_log /dev/stdout;
 server_tokens off;
 client_body_temp_path /tmp/client_body;
 proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi;
 uwsgi_temp_path /tmp/uwsgi;
 scgi_temp_path /tmp/scgi;
 server {
  listen 80;
  server_name 3.36.58.188;
  location ^~ /.well-known/acme-challenge/ { root /var/www/acme; try_files $uri =404; }
  location = /health { return 200 'wgss-ec2-acme\n'; add_header Content-Type text/plain; }
  location / { return 302 https://3.36.58.188$request_uri; }
 }
}
