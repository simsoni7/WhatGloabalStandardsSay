user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 charset utf-8;
 access_log /dev/stdout;
 server_tokens off;
 client_max_body_size 9m;
 client_body_temp_path /tmp/client_body;
 proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi;
 uwsgi_temp_path /tmp/uwsgi;
 scgi_temp_path /tmp/scgi;
 server {
  listen 80;
  server_name 3.36.58.188;
  location ^~ /.well-known/acme-challenge/ { root /var/www/acme; try_files $uri =404; }
  location = /health { return 200 'wgss-ec2-acme\n'; add_header Content-Type text/plain; }
  location / { return 302 https://3.36.58.188$request_uri; }
 }
 server {
  listen 443 ssl;
  server_name 3.36.58.188;
  ssl_certificate /etc/letsencrypt/live/wgss-ip/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/wgss-ip/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location = / { return 302 /WhatGloabalStandardsSay/wgss/; }
  location = /wgss/ { return 302 /WhatGloabalStandardsSay/wgss/; }
  location /WhatGloabalStandardsSay/wgss/ { try_files $uri $uri/ =404; add_header Cache-Control no-cache; }
  location = /health { return 200 'wgss-ec2-https\n'; add_header Content-Type text/plain; }
  # Anonymous public queue proxy, with operator credentials removed. The frontend
  # ordinarily calls central intake directly, preserving its native admin login.
  location = /api/wgss {
   proxy_pass https://wgss-public-intake.booknfoto461.chatgpt.site;
   proxy_ssl_server_name on;
   proxy_set_header Host wgss-public-intake.booknfoto461.chatgpt.site;
   proxy_set_header Origin https://simsoni7.github.io;
   proxy_set_header Sec-Fetch-Site same-origin;
   proxy_set_header OAI-Authenticated-User-Id "";
   proxy_set_header OAI-Authenticated-User-Email "";
   proxy_set_header OAI-Sites-Authorization "";
   proxy_set_header Authorization "";
   proxy_set_header Cookie "";
   proxy_set_header X-WGSS-Admin-Key "";
   proxy_set_header X-Forwarded-For "";
   proxy_read_timeout 180s;
   proxy_buffering off;
  }
  location /workspace/ { return 302 https://wgss-public-intake.booknfoto461.chatgpt.site$request_uri; }
  location / { return 404; }
 }
}
